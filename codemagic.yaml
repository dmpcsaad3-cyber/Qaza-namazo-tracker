workflows:
  android-build:
    name: Android Build
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      groups:
        - google_play
    scripts:
      - name: Set up local.properties
        script: |
          cd app
          echo "sdk.dir=$HOME/programs/android/sdk" > local.properties
      - name: Generate android folder
        script: |
          cd app
          flutter create .
      - name: Build Android app
        script: |
          cd app
          flutter build apk --debug
    artifacts:
      - app/build/app/outputs/**/*.apk
    publishing:
      email:
        recipients:
          - dmpcsaad3@gmail.com